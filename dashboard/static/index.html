<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p300 dashboard</title>
<script>
/* theme before first paint (no flash): ?theme= override, else the saved
   choice, else auto = light 07–19 local. app.js owns it from then on. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var m = q || localStorage.getItem("p300.theme") || "auto";
    var h = new Date().getHours();
    var t = (m === "light" || m === "dark") ? m : ((h >= 7 && h < 19) ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* storage blocked: CSS default (dark) */ }
})();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div id="topbar"><button id="theme-btn" class="theme-btn"
    title="cycle: auto (light 07–19) → light → dark">theme</button></div>
  <div id="banner" class="banner banner-wait">connecting…</div>
  <div id="alerts"></div>
  <div id="fleet" class="fleet"></div>
</header>
<main>
  <section id="feeds-section">
    <h2>data feeds <span id="feeds-note" class="dim"></span></h2>
    <div id="feeds"></div>
    <div id="feeds-footer" class="dim"></div>
  </section>
  <section id="positioning-section">
    <h2>positioning <span class="dim">daily long/short account ratio · what the CPR gate and the regime circuit breaker see</span></h2>
    <div id="positioning" class="fleet"></div>
  </section>
  <section id="chart-section">
    <h2>trades + flow</h2>
    <div id="chart-controls" class="controls"></div>
    <div id="flow-legend" class="flow-legend"></div>
    <div id="chart-wrap">
      <div id="chart"></div>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>
    <div id="tape" class="tape"></div>
    <div id="ssq" class="dim"></div>
    <div id="profile"></div>
    <div id="trade-detail" class="hidden"></div>
  </section>
  <section id="bots-section">
    <h2>bots</h2>
    <div id="bot-tabs" class="controls"></div>
    <div id="bot-info"></div>
  </section>
</main>
<footer class="dim" id="foot"></footer>
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
